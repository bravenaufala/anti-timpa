[package]
name = "anti-timpa-tauri"
version = "0.1.0"
description = "Anti Timpa QRIS Scanner - on-device QRIS security analysis"
authors = ["Anti Timpa"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri's mobile targets (Android/iOS) link against,
# so all app logic lives here and `main.rs` is a thin wrapper.
[lib]
name = "anti_timpa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Desktop webcam capture via nokhwa. Kept behind a feature so mobile builds
# (which receive frames from a native plugin) do not pull in v4l2/AVFoundation.
default = ["desktop-camera"]
desktop-camera = ["dep:nokhwa"]

# Compiles the Android JNI bridge on a desktop host so its unit tests can run
# without an Android toolchain. Android builds enable it via cfg automatically.
jni-bridge = []

# Links the QR *encoder*, used by the synthetic backend to render real symbols.
#
# Off by default and never enabled in the app's own `tauri.conf.json` build: the
# shipping product only reads QR codes, so the encoder is dead weight in a
# release binary. Tests enable it, and so does the `probe_import` diagnostic.
# An optional dependency rather than a `[dev-dependencies]` entry because a
# dev-dependency is not visible from the library's own modules when an example
# links against it.
qr-encode = ["dep:qrcode"]

# Enables the OS location plugin. Mobile builds turn this on automatically via
# `cfg(mobile)`; on desktop it stays off because there is no OS location service
# to ask — desktop gets location from a user-entered city or the offline table.
geolocation = ["dep:tauri-plugin-geolocation"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# QR decoding. Pure Rust; no OpenCV needed.
rqrr = "0.10"

# Image buffer container used at the Decode boundary, and for encoding the
# camera preview to JPEG, and for decoding imported images.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Encodes preview JPEGs for transport over IPC as data URLs.
base64 = "0.22"

# Android JNI. Needed to reach JNIEnv::get_direct_buffer_address, because a
# java.nio.ByteBuffer parameter is a JVM object reference, not a raw pointer.
# Also a normal dependency on the host so the bridge compiles under the
# `jni-bridge` feature for unit testing.
jni = "0.21"

# Desktop webcam capture (Linux V4L2 / macOS AVFoundation / Windows MSMF).
nokhwa = { version = "0.10", optional = true, features = [
    "input-native",
    "decoding",
] }

# QR encoding, for the synthetic test backend only. See the `qr-encode` feature.
qrcode = { version = "0.14", optional = true }

# OS location, for Layer 3's distance estimate. See the `geolocation` feature.
tauri-plugin-geolocation = { version = "2", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
